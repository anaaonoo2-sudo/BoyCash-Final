name: Build BoyCash APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip
        run: unzip -o boycash_project.zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Sync
        run: |
          ROOT=$(find . -name "package.json" -exec dirname {} \; | head -n 1)
          cd "$ROOT"
          npm install
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          ANDROID_DIR=$(find . -name "build.gradle" -not -path "*/node_modules/*" | head -n 1)
          cd $(dirname "$ANDROID_DIR")
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoyCash-App
          path: "**/*.apk"
          
