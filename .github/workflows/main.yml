name: Build BoyCash APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip
        run: unzip -o boycash_project.zip

      - name: JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          fi
          cd "$PROJECT_ROOT"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoyCash-App
          path: "**/*.apk"
          
