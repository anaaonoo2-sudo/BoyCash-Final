name: Build BoyCash APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Force Extract Everything
        run: |
          unzip -o boycash_project.zip -d extracted_files
          # نقل كل شيء من المجلدات الفرعية إلى المجلد الرئيسي مباشرة
          find extracted_files -name "build.gradle" -exec dirname {} \; | xargs -I % cp -R %/. .
          rm -rf extracted_files

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android
        run: |
          # إنشاء ملفات تشغيل جديدة لأن التي في الـ ZIP قد تكون تالفة
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoyCash-App
          path: "**/build/outputs/apk/debug/*.apk"
          
