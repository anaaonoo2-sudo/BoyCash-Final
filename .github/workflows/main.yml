name: Build BoyCash APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Project
        run: unzip boycash_project.zip

      - name: List Files for Diagnosis
        run: ls -R

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Root Force Build
        run: |
          # Find the directory containing build.gradle
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found"
            exit 1
          fi
          
          cd $(dirname "$BUILD_FILE")
          
          # Force create a new gradle wrapper
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoyCash-App
          path: "**/app-debug.apk"
          
