name: Build BoyCash APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Project
        run: unzip boycash_project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Root Solution Build
        run: |
          # 1. Find the real android directory
          ANDROID_PATH=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          cd "$ANDROID_PATH"
          
          # 2. Fix permissions and environment
          chmod +x gradlew || true
          
          # 3. Clean and Build from scratch
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoyCash-App
          path: "**/app-debug.apk"
          
