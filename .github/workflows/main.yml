name: Build BoyCash APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Project
        run: unzip boycash_project.zip

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build Android
        run: |
          ANDROID_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          cd "$ANDROID_DIR"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoyCash-App
          path: "**/app-debug.apk"
          
