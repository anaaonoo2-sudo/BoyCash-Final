name: Build BoyCash APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Project
        run: unzip boycash_project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android
        run: |
          # Search for the directory containing gradlew
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found in the ZIP file"
            exit 1
          fi
          
          # Move to that directory
          cd $(dirname "$GRADLEW_PATH")
          
          # Fix permissions and build
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoyCash-App
          path: "**/app-debug.apk"
          
