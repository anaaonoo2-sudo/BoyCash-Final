name: Build BoyCash APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Project
        run: unzip -o boycash_project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ultimate Build
        run: |
          find . -name "gradlew" -exec chmod +x {} \;
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            ROOT_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
            cd "$ROOT_DIR"
            gradle wrapper --gradle-version 8.0
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            cd $(dirname "$GRADLEW_PATH")
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoyCash-App
          path: "**/*.apk"
          
